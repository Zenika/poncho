- id: '1730308674654'
  alias: Temperature supérieur Réunion
  description: ''
  triggers:
  - type: temperature
    device_id: f8c6d6c4c45d47e84806ba8a93bbf314
    entity_id: 0061fce95938dda8069b520c8db5ac71
    domain: sensor
    trigger: device
    above: 20
  - trigger: state
    entity_id:
    - input_boolean.bureau_actifs
    from:
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.bureau_actifs
    state: 'on'
  - condition: numeric_state
    entity_id: sensor.sonoff_snzb_02d_temperature
    above: 20
  actions:
  - action: notify.zenika
    data:
      message: Il fait bien chaud dans la salle Réunion, c'est étrange, est il toujours
        bien réglé ?
      title: Réunion
  mode: single
